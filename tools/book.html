<!doctype html><meta charset="utf-8"><title>CTTT book builder</title>
<p>Builds the Master opening book (first player's forced win). Saves to js/book.js when the dev server runs with -AllowSave.</p>
<pre id="out"></pre>
<script>
var q = new URLSearchParams(location.search), out = document.getElementById('out');
var w = new Worker('book-worker.js');
w.onmessage = function (e) {
  out.textContent += e.data.log + '\n';
  if (e.data.book) {
    var src = '/* Generated by tools/book.html - do not edit. Winning replies for the first player. */\nself.CTTT_BOOK = ' + JSON.stringify(e.data.book) + ';\n';
    fetch('/__save-book', { method: 'POST', body: src }).then(function (r) { out.textContent += 'save: ' + r.status + ' bytes=' + src.length + '\n'; });
  }
};
w.onerror = function (e) { out.textContent += 'ERR ' + e.message + '\n'; };
w.postMessage({ thresh: +(q.get('thresh') || 200000) });
</script>
